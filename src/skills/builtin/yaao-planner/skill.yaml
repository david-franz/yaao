name: yaao-planner
version: 1
description: Generate an implementation plan from a description
appliesTo:
  agents: [claude-code, cursor, copilot, codex, api]
tools:
  - read_file
  - write_file
  - list_files
  - context_query
inputs:
  - name: description
    description: What to plan
    required: true
  - name: scope
    description: feature | project
    default: feature
  - name: format
    description: markdown | speckit | both
    default: markdown
  - name: out
    description: Output directory
    default: .yaao/plans/
  - name: enabled-agents
    description: Comma-separated list of agents the user has enabled in yaao.config.json
    required: true
trigger:
  manual: true
